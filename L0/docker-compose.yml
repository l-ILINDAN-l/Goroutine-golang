services:
  # 1. Ваше Go-приложение
  app:
    build: .
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - postgres-lookup
      - postgres-shard1
      - postgres-shard2
      - redis
      - kafka

  # 2. Базы данных PostgreSQL
  postgres-lookup:
    image: postgres:14-bookworm
    restart: always
    env_file: # <-- Явно указываем файл
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orders_db
    ports:
      - "5431:5432"
    volumes:
      - postgres_lookup_data:/var/lib/postgresql/data

  postgres-shard1:
    image: postgres:14-bookworm
    restart: always
    env_file: # <-- Явно указываем файл
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orders_db
    ports:
      - "5430:5432" # Измененный порт
    volumes:
      - postgres_shard1_data:/var/lib/postgresql/data

  postgres-shard2:
    image: postgres:14-bookworm
    restart: always
    env_file: # <-- Явно указываем файл
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_shard2_data:/var/lib/postgresql/data

  # 3. Кеш
  redis:
    image: redis:7-bookworm
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 4. Брокер сообщений
  kafka:
    image: confluentinc/cp-kafka:latest
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,PLAINTEXT://0.0.0.0:9092'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  # 5. Стек мониторинга
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  # 6. Стек логирования
  elasticsearch:
    image: elasticsearch:8.9.0
    restart: always
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
    ports:
      - "9200:9200"

  kibana:
    image: kibana:8.9.0
    restart: always
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: elastic/filebeat:8.9.0
    restart: always
    user: root
    volumes:
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - app

volumes:
  postgres_lookup_data:
  postgres_shard1_data:
  postgres_shard2_data:
  grafana_data:
  redis_data: