name: GoLinterCheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - name: CheckoutCode
        uses: actions/checkout@v4

      - name: SetupGo
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: InstallStaticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: RunStaticcheck
        run: staticcheck ./...