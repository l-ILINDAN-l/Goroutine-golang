name: GoLinterCheck

on:
  push:
  pull_request:


jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - name: CheckoutCode
        uses: actions/checkout@v4

      - name: SetupGo
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: InstallStaticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: RunStaticcheck
        run: |
          for modfile in $(find . -name go.mod); do
            dir=$(dirname "$modfile")
          
            echo "==> Checking module in $dir"
          
            # Эта команда должна быть на новой строке
            (cd "$dir" && staticcheck ./...)
          done